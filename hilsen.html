<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>Hilsener til Henning</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icons/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="icons/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-hilsen">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg-shade"></div>
    </div>

    <div class="music-scene" aria-hidden="true">
      <span class="glyph glyph-clef g1">𝄞</span>
      <span class="glyph g4">♫</span>
      <span class="glyph glyph-clef g10">𝄞</span>
      <span class="glyph g11">♪</span>
    </div>

    <main class="wrap wrap-hilsen">
      <header class="hilsen-page-head">
        <h1>Hilsener til Henning</h1>
      </header>

      <p id="hilsenEmpty" class="hilsen-empty" hidden>
        Der er endnu ingen hilsener.
      </p>
      <p id="hilsenError" class="hilsen-error" hidden>
        Kunne ikke hente hilsener. Prøv at genindlæse siden.
      </p>

      <div id="hilsenGrid" class="hilsen-grid"></div>
    </main>

    <dialog id="hilsenLightbox" class="hilsen-lightbox" aria-label="Forstørret hilsen">
      <div class="hilsen-lightbox-inner">
        <button type="button" class="lightbox-close" data-close-lightbox aria-label="Luk">
          ×
        </button>
        <div class="lightbox-img-frame">
          <img id="lightboxImg" class="lightbox-img" alt="" />
        </div>
        <div class="lightbox-details">
          <p id="lightboxName" class="lightbox-name"></p>
          <p id="lightboxDate" class="lightbox-date"></p>
          <p id="lightboxMsg" class="lightbox-msg"></p>
        </div>
      </div>
    </dialog>

    <script src="js/hilsen-gallery.js" defer></script>
  </body>
</html>
