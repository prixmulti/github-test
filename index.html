<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>githubtest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <p class="tag">Live fra serveren</p>
      <h1>Hej, githubtest</h1>
      <p class="lead">
        Denne side kører via <strong>GitHub</strong> og
        <strong>FTP</strong>. Når du pusher til <code>main</code>, lander
        ændringerne her automatisk.
      </p>

      <div class="pill-row">
        <span class="pill pill-ok">Deploy: aktiv</span>
        <span class="pill">19. nov 2026</span>
      </div>

      <section class="steps">
        <h2>Sådan opdaterer du</h2>
        <ol>
          <li>Rediger filer lokalt</li>
          <li><code>git push origin main</code></li>
          <li>Vent på grøn markering i Actions</li>
        </ol>
      </section>
    </main>
  </body>
</html>
